name: SonarQube

on:
  push:
    branches: [main]
    paths:
      - '**/*.c'
      - '**/*.cc'
      - '**/*.cpp'
      - '**/*.cs'
      - '**/*.go'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.java'
      - '**/*.js'
      - '**/*.jsx'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.mjs'
      - '**/*.php'
      - '**/*.py'
      - '**/*.rb'
      - '**/*.rs'
      - '**/*.sh'
      - '**/*.ts'
      - '**/*.tsx'
      - '.github/workflows/sonarqube-analysis.yml'
      - 'sonar-project.properties'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarqube-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ci-standard
    timeout-minutes: 20
    env:
      SONARQUBE_SELF_HOSTED_URL: ${{ vars.SONARQUBE_SELF_HOSTED_URL }}
      SONARQUBE_SELF_HOSTED_TOKEN: ${{ secrets.SONARQUBE_SELF_HOSTED_TOKEN }}
      SSL_CERT_FILE: /etc/sonarqube-trust/ca-certificates.pem
      SONAR_SCANNER_OPTS: >-
        -Djavax.net.ssl.trustStore=/etc/sonarqube-trust/bundle.p12
        -Djavax.net.ssl.trustStoreType=PKCS12

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install dirmngr for SonarScanner signature verification
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends dirmngr

      - name: Run SonarQube analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_HOST_URL: ${{ env.SONARQUBE_SELF_HOSTED_URL }}
          SONAR_TOKEN: ${{ env.SONARQUBE_SELF_HOSTED_TOKEN }}
          SONAR_SCANNER_OPTS: ${{ env.SONAR_SCANNER_OPTS }}
